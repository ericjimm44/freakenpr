<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vibe Coding Hub</title>
  <meta name="description" content="A gamified dashboard tracking every vibe-coded project — builder level, XP, streaks, progress, quests and achievements.">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- ============ LEFT SIDEBAR ============ -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-logo">vibe</span>
        <span class="brand-sub">CODING HUB</span>
      </div>

      <nav class="nav">
        <button class="nav-item active" data-target="top"><span class="nav-ico">🏠</span> Dashboard</button>
        <button class="nav-item" data-target="projects-section"><span class="nav-ico">📁</span> Projects</button>
        <button class="nav-item" data-target="quests-section"><span class="nav-ico">🎯</span> Quests</button>
        <button class="nav-item" data-target="activity-section"><span class="nav-ico">📈</span> Timeline</button>
        <button class="nav-item" data-target="roadmap-section"><span class="nav-ico">🗺️</span> Roadmap</button>
        <button class="nav-item" data-target="missions-section"><span class="nav-ico">🚩</span> Missions</button>
        <button class="nav-item" data-target="skills-section"><span class="nav-ico">📊</span> Languages</button>
        <button class="nav-item" data-target="achievements-section"><span class="nav-ico">🏆</span> Achievements</button>
      </nav>

      <div class="profile-card" id="profile-card"></div>
    </aside>

    <!-- ============ MAIN COLUMN ============ -->
    <main class="main" id="top">
      <header class="greeting">
        <div class="greeting-text">
          <h1 id="greeting-title">Good to see you 👋</h1>
          <p class="muted">Code. Build. Ship. Repeat.</p>
        </div>
        <div class="greeting-art" id="greeting-art" aria-hidden="true">🌇</div>
      </header>

      <section class="stat-row" id="stat-row"></section>

      <section class="block" id="projects-section">
        <div class="block-head">
          <h2>Your Projects</h2>
          <div class="block-actions">
            <span class="updated-at" id="updated-at"></span>
            <button class="refresh-btn" id="refresh-btn" title="Check for new projects">
              <span class="refresh-ico">🔄</span> Refresh
            </button>
          </div>
        </div>
        <div class="project-grid" id="project-grid">
          <p class="loading">Loading projects…</p>
        </div>
      </section>

      <section class="block" id="roadmap-section">
        <div class="block-head">
          <h2>Project Roadmap: <span id="roadmap-project" class="accent"></span></h2>
        </div>
        <div class="roadmap" id="roadmap"></div>
      </section>

      <section class="block" id="missions-section">
        <div class="block-head">
          <h2>Mission Board</h2>
          <button class="link-muted" data-target="roadmap-section">View roadmap ▸</button>
        </div>
        <div class="mission-board" id="mission-board"></div>
      </section>

      <footer class="hub-footer">
        Built with vibes · projects auto-sync from
        <a href="https://github.com/ericjimm44/freakenpr" target="_blank" rel="noopener">GitHub</a>
        · edit <code>hub/data.json</code> to update
      </footer>
    </main>

    <!-- ============ RIGHT SIDEBAR ============ -->
    <aside class="rail">
      <section class="panel" id="skills-section">
        <div class="panel-head"><h3>Top Languages</h3><span class="link-muted">% of code</span></div>
        <div id="skills"></div>
      </section>

      <section class="panel" id="quests-section">
        <div class="panel-head"><h3>Today's Quests</h3><span class="quest-progress" id="quest-progress"></span></div>
        <div id="quests"></div>
        <div class="quest-reward" id="quest-reward"></div>
      </section>

      <section class="panel" id="activity-section">
        <div class="panel-head"><h3>Activity Feed</h3></div>
        <div id="activity"></div>
      </section>

      <section class="panel" id="achievements-section">
        <div class="panel-head"><h3>Achievements</h3><span class="link-muted" id="ach-count"></span></div>
        <div class="badge-grid" id="achievements"></div>
      </section>
    </aside>
  </div>

  <script src="hub.js"></script>
</body>
</html>
