<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PocketAI — Kira</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="desktop-bg">

    <!-- Companion -->
    <div class="companion-container" id="companion">
      <div class="character-wrap">
        <svg id="kira" viewBox="0 0 120 200" xmlns="http://www.w3.org/2000/svg">
          <!-- Shadow -->
          <ellipse cx="60" cy="197" rx="26" ry="4" fill="rgba(0,0,0,0.18)"/>
          <!-- Legs -->
          <rect x="42" y="168" width="14" height="24" rx="4" fill="#1e1b4b"/>
          <rect x="64" y="168" width="14" height="24" rx="4" fill="#1e1b4b"/>
          <!-- Feet -->
          <rect x="38" y="186" width="18" height="9" rx="4" fill="#312e81"/>
          <rect x="60" y="186" width="18" height="9" rx="4" fill="#312e81"/>
          <!-- Body -->
          <rect x="35" y="116" width="50" height="56" rx="8" fill="#2d1b69"/>
          <!-- Arms -->
          <rect x="16" y="118" width="20" height="9" rx="4" fill="#2d1b69"/>
          <rect x="84" y="118" width="20" height="9" rx="4" fill="#2d1b69"/>
          <!-- Hands -->
          <circle cx="14" cy="122" r="6" fill="#fde8d8"/>
          <circle cx="106" cy="122" r="6" fill="#fde8d8"/>
          <!-- Core glow -->
          <ellipse cx="60" cy="138" rx="10" ry="12" fill="#7c3aed" opacity="0.5" class="core-pulse"/>
          <ellipse cx="60" cy="138" rx="6"  ry="8"  fill="#c4b5fd" class="core-pulse"/>
          <!-- Neck -->
          <rect x="52" y="106" width="16" height="14" rx="3" fill="#fde8d8"/>
          <!-- Head -->
          <circle cx="60" cy="76" r="38" fill="#fde8d8"/>
          <!-- Hair back -->
          <ellipse cx="60" cy="50" rx="38" ry="20" fill="#1e1b4b"/>
          <!-- Hair front/top -->
          <path d="M22 70 Q20 38 60 34 Q100 38 98 70" fill="#1e1b4b"/>
          <!-- Hair spikes -->
          <path d="M29 63 Q24 36 37 33 Q31 53 39 59" fill="#312e81"/>
          <path d="M91 63 Q96 36 83 33 Q89 53 81 59" fill="#312e81"/>
          <path d="M60 34 Q57 20 64 18 Q67 30 62 39" fill="#312e81"/>
          <path d="M47 36 Q41 22 49 20 Q51 33 54 39" fill="#312e81"/>
          <!-- Ears -->
          <ellipse cx="22" cy="76" rx="7" ry="8" fill="#fde8d8"/>
          <ellipse cx="98" cy="76" rx="7" ry="8" fill="#fde8d8"/>
          <ellipse cx="22" cy="76" rx="4" ry="5" fill="#f5c6b0"/>
          <ellipse cx="98" cy="76" rx="4" ry="5" fill="#f5c6b0"/>
          <!-- Cyber ear pieces -->
          <rect x="14" y="72" width="8" height="8" rx="2" fill="#7c3aed" opacity="0.9"/>
          <rect x="98" y="72" width="8" height="8" rx="2" fill="#7c3aed" opacity="0.9"/>
          <circle cx="18"  cy="76" r="2" fill="#c4b5fd" class="core-pulse"/>
          <circle cx="102" cy="76" r="2" fill="#c4b5fd" class="core-pulse"/>
          <!-- Eyes whites -->
          <ellipse cx="44" cy="78" rx="11" ry="13" fill="white"/>
          <ellipse cx="76" cy="78" rx="11" ry="13" fill="white"/>
          <!-- Irises -->
          <ellipse cx="44" cy="79" rx="8" ry="9" fill="#4c1d95"/>
          <ellipse cx="76" cy="79" rx="8" ry="9" fill="#4c1d95"/>
          <!-- Pupils -->
          <ellipse cx="44" cy="80" rx="5" ry="6" fill="#1e1b4b" id="pupilL"/>
          <ellipse cx="76" cy="80" rx="5" ry="6" fill="#1e1b4b" id="pupilR"/>
          <!-- Eye shine -->
          <circle cx="47" cy="75" r="2.5" fill="white" opacity="0.9"/>
          <circle cx="41" cy="83" r="1.2" fill="white" opacity="0.5"/>
          <circle cx="79" cy="75" r="2.5" fill="white" opacity="0.9"/>
          <circle cx="73" cy="83" r="1.2" fill="white" opacity="0.5"/>
          <!-- Blink layers -->
          <ellipse cx="44" cy="72" rx="11" ry="13" fill="#fde8d8" id="blinkL" opacity="0"/>
          <ellipse cx="76" cy="72" rx="11" ry="13" fill="#fde8d8" id="blinkR" opacity="0"/>
          <!-- Eyebrows -->
          <path d="M33 65 Q44 61 55 65" stroke="#1e1b4b" stroke-width="2.5" fill="none" stroke-linecap="round" id="browL"/>
          <path d="M65 65 Q76 61 87 65" stroke="#1e1b4b" stroke-width="2.5" fill="none" stroke-linecap="round" id="browR"/>
          <!-- Nose -->
          <circle cx="60" cy="89" r="1.5" fill="#f5c6b0"/>
          <!-- Mouth -->
          <path d="M50 97 Q60 104 70 97" stroke="#e8a090" stroke-width="2" fill="none" stroke-linecap="round" id="mouth"/>
          <!-- Blush -->
          <ellipse cx="32" cy="89" rx="8" ry="5" fill="#ff9999" opacity="0.3" id="blushL"/>
          <ellipse cx="88" cy="89" rx="8" ry="5" fill="#ff9999" opacity="0.3" id="blushR"/>
        </svg>

        <!-- Speech bubble -->
        <div class="speech-bubble" id="speechBubble">
          <span id="speechText"></span>
        </div>
      </div>
      <div class="companion-name">Kira</div>
    </div>

    <!-- Chat panel -->
    <div class="chat-panel" id="chatPanel">
      <div class="chat-header">
        <span class="chat-title">Chat with Kira</span>
        <button class="icon-btn" id="chatClose">×</button>
      </div>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input-wrap">
        <input type="text" id="chatInput" placeholder="Say something…" autocomplete="off"/>
        <button id="chatSend">→</button>
      </div>
    </div>

    <!-- Goals panel -->
    <div class="goals-panel" id="goalsPanel" style="display:none">
      <div class="panel-header">
        <span>Goals &amp; Tracking</span>
        <button class="icon-btn" id="goalsClose">×</button>
      </div>
      <div class="goals-list" id="goalsList"></div>
      <div class="goals-add">
        <input type="text" id="goalInput" placeholder="Add a goal…"/>
        <button id="goalAdd">+</button>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <button class="tool-btn" id="btnChat"     title="Chat">💬</button>
      <button class="tool-btn" id="btnGoals"    title="Goals">🎯</button>
      <button class="tool-btn" id="btnSettings" title="Settings">⚙️</button>
    </div>

    <!-- Settings modal -->
    <div class="modal-overlay" id="settingsModal" style="display:none">
      <div class="modal">
        <h3>Settings</h3>
        <label>Your name</label>
        <input type="text"     id="userName" placeholder="What should Kira call you?"/>
        <label>Claude API Key <span style="opacity:.4">(optional)</span></label>
        <input type="password" id="apiKey"   placeholder="sk-ant-…"/>
        <small>Stored in your browser only. Enables real AI responses via Claude Haiku.</small>
        <div class="modal-actions">
          <button id="settingsCancel">Cancel</button>
          <button id="settingsSave">Save</button>
        </div>
      </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
